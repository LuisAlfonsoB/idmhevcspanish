<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reading mode</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src http: https: data:; style-src 'self' onedm: 'unsafe-inline'; script-src 'self' onedm:">
<link rel="stylesheet" href="onedm://shared/shared.css">
<style>
body.sepia{--bg:#f4ecd8;--card:#f4ecd8;--fg:#433422;--muted:#7a6a55;--border:#dccfae}
body.dark{--bg:#121212;--card:#1c1c1c;--fg:#d8d8d8;--muted:#999;--border:#333}
body.light{--bg:#fff;--card:#fff;--fg:#202124;--muted:#666;--border:#ddd}
#bar{position:sticky;top:0;display:flex;gap:6px;justify-content:center;padding:8px;background:var(--bg);border-bottom:1px solid var(--border)}
article{max-width:700px;margin:0 auto;padding:30px 20px 80px;font-size:var(--fs,19px);line-height:1.7}
article.serif{font-family:Georgia,"Times New Roman",serif}
h1.title{font-size:1.7em;line-height:1.25;margin:.2em 0}.meta{color:var(--muted);font-size:.8em;margin-bottom:1.5em}
article img{max-width:100%;height:auto;border-radius:6px}pre{overflow:auto;padding:12px;background:var(--hover);border-radius:8px}blockquote{margin:1em 0;padding-left:16px;border-left:3px solid var(--border);color:var(--muted)}
table{border-collapse:collapse;display:block;overflow:auto}td,th{border:1px solid var(--border);padding:4px 8px}
</style></head><body>
<div id="bar"><button data-a="dec">A−</button><button data-a="inc">A+</button><button data-a="font">Serif</button><button data-a="light">Light</button><button data-a="sepia">Sepia</button><button data-a="dark">Dark</button></div>
<article id="art"><p style="color:var(--muted)">Loading…</p></article>
<script src="onedm://shared/shared.js"></script>
<script src="onedm://shared/reader.js"></script>
</body></html>
